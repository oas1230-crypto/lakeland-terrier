<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лейкленд — сравнение размера слогана</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1ee;color:#243c45;font:15px system-ui,sans-serif}header{padding:20px 24px;text-align:center}h1{font-size:21px;margin:0 0 8px;font-weight:600}p{margin:0 0 14px;color:#536861}nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{border:1px solid #ccd8d1;border-radius:24px;padding:10px 18px;font:inherit;cursor:pointer;background:#fafcf9;color:#243c45;transition:background .18s}button[aria-pressed=true]{background:#29454c;color:white}button:focus-visible{outline:3px solid #bf9657;outline-offset:3px}main{padding:0 18px 24px;max-width:2300px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0;min-width:0}figcaption{padding:10px 4px;font-weight:600}img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #d4ded8}body[data-view=previous] main,body[data-view=larger] main{display:block;max-width:1147px}body[data-view=previous] #larger,body[data-view=larger] #previous{display:none}@media(max-width:700px){main{grid-template-columns:1fr}header{padding:16px}h1{font-size:19px}}
</style></head>
<body data-view="both"><header><h1>Размер слогана на обложке</h1><p>Фотография и оформление одинаковые. Увеличенный слоган крупнее примерно на 10%.</p><nav aria-label="Способ сравнения"><button data-view="both" aria-pressed="true">Рядом</button><button data-view="previous" aria-pressed="false">Предыдущий</button><button data-view="larger" aria-pressed="false">Увеличенный</button></nav></header>
<main><figure id="previous"><figcaption>Предыдущий размер</figcaption><img src="trails-desktop-cta.png" alt="Озёрные тропы с предыдущим размером слогана"></figure><figure id="larger"><figcaption>Увеличенный размер · +10%</figcaption><img src="trails-larger-slogan.png" alt="Озёрные тропы с увеличенным слоганом"></figure></main>
<script>const buttons=[...document.querySelectorAll('button[data-view]')];buttons.forEach(button=>button.addEventListener('click',()=>{document.body.dataset.view=button.dataset.view;buttons.forEach(item=>item.setAttribute('aria-pressed',String(item===button)));}));</script></body></html>
